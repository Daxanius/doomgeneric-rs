[package]
name = "doomgeneric"
version = "0.3.0"
edition = "2018"
description = "Bindings for the doomgeneric doom port."
authors = ["Linus <linus@cosmos-ink.net"]
license = "GPL-2.0-only"
readme = "README.md"
repository = "https://github.com/LinusCDE/doomgeneric-rs"
homepage = "https://crates.io/crates/doomgeneric"
categories = [ "external-ffi-bindings", "rendering" ]
keywords = [ "doom", "ffi", "game" ]

[features]
default = []
cmap256 = [] 
window = ["dep:minifb"]

[dependencies]
minifb = { version = "0.28", optional = true }

[[bin]]
name = "doomgeneric-play"
path = "src/main.rs"
required-features = ["window"]

[build-dependencies]
cc = "1.0"